<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cathay Speaking Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one centered column. Slide tabs, sentence pills, a stage of word chips, one big mic button, result card. */
:root{
  --bg:#edf3f0; --surface:#fbfdfc; --ink:#10241f; --muted:#5b706a; --line:#cddbd5;
  --jade:#006e60; --jade-ink:#ffffff; --jade-soft:#d6ebe5;
  --ok:#0a7b5c; --ok-bg:#d6f0e4;
  --bad:#c0332a; --bad-bg:#fbe0dc;
  --cur:#d99a1c;
  --font-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --font-body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1412; --surface:#121d1a; --ink:#e5f0ec; --muted:#91a9a1; --line:#25362f;
    --jade:#3cc4a8; --jade-ink:#06231d; --jade-soft:#17332d;
    --ok:#4fd6a5; --ok-bg:#12372c;
    --bad:#ff7a6e; --bad-bg:#3a1b18;
    --cur:#f0b640; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1412; --surface:#121d1a; --ink:#e5f0ec; --muted:#91a9a1; --line:#25362f;
  --jade:#3cc4a8; --jade-ink:#06231d; --jade-soft:#17332d;
  --ok:#4fd6a5; --ok-bg:#12372c;
  --bad:#ff7a6e; --bad-bg:#3a1b18;
  --cur:#f0b640; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.5;
  padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--font-display);font-size:1.35rem;margin:0;letter-spacing:-.01em;font-weight:700}
h1 small{display:block;font-family:var(--font-body);font-weight:400;font-size:.8rem;color:var(--muted);letter-spacing:0}
.toggle{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:8px 14px;font:inherit;font-size:.85rem;cursor:pointer}
.toggle[aria-pressed="true"]{border-color:var(--jade)}
.toggle .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.toggle[aria-pressed="true"] .dot{background:var(--jade)}

.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{flex:1 1 140px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer;min-width:0}
.tab b{display:block;font-family:var(--font-display);font-size:1rem}
.tab span{font-size:.8rem;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.tab[aria-selected="true"] span{color:inherit;opacity:.85}

.pills{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{position:relative;min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);font:inherit;font-weight:600;cursor:pointer;display:grid;place-items:center}
.pill[aria-current="true"]{border-color:var(--jade);box-shadow:0 0 0 2px var(--jade) inset}
.pill i{position:absolute;right:5px;top:5px;width:8px;height:8px;border-radius:50%;background:transparent}
.pill[data-r="perfect"] i{background:var(--ok)}
.pill[data-r="partial"] i{background:var(--cur)}
.pills .score{margin-left:auto;font-size:.8rem;color:var(--muted)}

.stage{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 16px 16px;display:flex;flex-direction:column;gap:16px}
.slidelabel{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:10px 8px}
.chip{position:relative;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;
  padding:8px 11px 7px;text-align:center;cursor:pointer;font:inherit;min-width:0;max-width:100%;display:flex;flex-direction:column;gap:1px;align-items:center}
.chip .en{font-family:var(--font-display);font-weight:500;font-size:1.3rem;line-height:1.2;overflow-wrap:anywhere}
.chip .th{font-size:.78rem;color:var(--muted);line-height:1.3}
.chip .heard{font-size:.7rem;color:var(--bad);min-height:0;line-height:1.2;overflow-wrap:anywhere}
.chip[data-s="ok"]{background:var(--ok-bg);border-color:var(--ok);animation:pop .28s ease-out}
.chip[data-s="ok"] .en{color:var(--ok)}
.chip[data-s="bad"]{background:var(--bad-bg);border-color:var(--bad);animation:shake .32s ease-in-out}
.chip[data-s="bad"] .en{color:var(--bad)}
.chip.cur{border-color:var(--cur);box-shadow:0 3px 0 var(--cur)}
.chip:focus-visible,.pill:focus-visible,.tab:focus-visible,.toggle:focus-visible,.btn:focus-visible,.mic:focus-visible{outline:3px solid var(--cur);outline-offset:2px}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mic{width:76px;height:76px;border-radius:50%;border:0;background:var(--jade);color:var(--jade-ink);cursor:pointer;
  display:grid;place-items:center;flex:none;position:relative}
.mic svg{width:32px;height:32px}
.mic.on{background:var(--bad);color:#fff}
.mic.on::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--bad);animation:ring 1.3s ease-out infinite}
@keyframes ring{from{transform:scale(.92);opacity:.9}to{transform:scale(1.25);opacity:0}}
.status{flex:1 1 200px;min-width:0}
.status b{display:block;font-weight:600}
.status span{color:var(--muted);font-size:.88rem}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:9px 16px;font:inherit;font-size:.9rem;cursor:pointer}
.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--jade-ink);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap}

.result{border-radius:14px;padding:14px 16px;background:var(--jade-soft);display:flex;flex-direction:column;gap:10px}
.result[hidden]{display:none}
.result .big{font-family:var(--font-display);font-size:1.6rem;font-weight:700}
.notice{border:1px solid var(--bad);background:var(--bad-bg);border-radius:12px;padding:12px 14px;font-size:.9rem}
.notice[hidden]{display:none}
.hint{font-size:.82rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){
  .chip[data-s],.mic.on::after{animation:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Cathay Speaking Check<small>อ่านออกเสียงทีละคำ ถูกมีเสียงติ้ง ผิดมีเสียงแอด</small></h1>
    <button class="toggle" id="soundBtn" type="button" aria-pressed="true"><span class="dot"></span>เสียงเอฟเฟกต์</button>
  </header>

  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="pills" id="pills"></div>

  <section class="stage" aria-label="ประโยคที่ต้องอ่าน">
    <div class="slidelabel" id="slideLabel"></div>
    <div class="chips" id="chips"></div>
    <div class="row">
      <button class="btn" id="hearLine" type="button">ฟังต้นแบบทั้งประโยค</button>
      <button class="btn" id="resetBtn" type="button">เริ่มประโยคนี้ใหม่</button>
    </div>
    <div class="controls">
      <button class="mic" id="mic" type="button" aria-label="เริ่มฟัง">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <div class="status" aria-live="polite"><b id="stTitle">พร้อมแล้ว</b><span id="stSub">กดไมค์ แล้วอ่านประโยคทีละคำ</span></div>
    </div>
    <div class="notice" id="notice" hidden></div>
    <div class="result" id="result" hidden aria-live="polite">
      <div class="big" id="resBig"></div>
      <div id="resSub" class="hint"></div>
      <div class="row">
        <button class="btn primary" id="nextBtn" type="button">ประโยคถัดไป</button>
        <button class="btn" id="retryBtn" type="button">ลองอีกครั้ง</button>
      </div>
    </div>
  </section>
  <p class="hint">แตะที่คำเพื่อฟังเสียงอ่านที่ถูกต้อง · ใช้ Chrome หรือ Edge จะแม่นที่สุด · คำที่ถูกจะขึ้นสีเขียว คำที่ผิดจะขึ้นสีแดงพร้อมบอกว่าได้ยินเป็นคำอะไร</p>
</div>

<script>
const SLIDES = [
  { title: "Slide 7", sub: "Cabin Classes", lines: [
    { en: "Cathay Pacific offers four cabin classes.",
      th: "แคเธ่ย์ แปซิฟิก ออฟเฟอร์ส โฟร์ เคบิน คลาส" },
    { en: "First Class, Business Class, Premium Economy Class, and Economy Class.",
      th: "เฟิร์สต์ คลาส, บิสซิเนส คลาส, พรีเมียม อีโคโนมี คลาส, แอนด์ อีโคโนมี คลาส" },
    { en: "Each class provides different levels of comfort and services to meet passengers' needs.",
      th: "อีช คลาส โพรไวด์ส ดิฟเฟอเรนท์ เลเวลส์ ออฟ คอมฟอร์ท แอนด์ เซอร์วิสเซส ทู มีท แพสเซนเจอร์ส นีดส" }
  ]},
  { title: "Slide 8", sub: "Slogan", lines: [
    { en: "Next is the slogan of Cathay Pacific.",
      th: "เน็กซ์ อิส เดอะ สโลแกน ออฟ แคเธ่ย์ แปซิฟิก" },
    { en: "Its slogan is \"Move Beyond.\"",
      th: "อิทส์ สโลแกน อิส มูฟ บียอนด์" },
    { en: "This slogan represents the idea of going further and creating new experiences for passengers.",
      th: "ดิส สโลแกน เรพรีเซนต์ส ดิ ไอเดีย ออฟ โกอิง เฟอร์เธอร์ แอนด์ ครีเอททิง นิว เอ็กซ์พีเรียนเซส ฟอร์ แพสเซนเจอร์ส" }
  ]}
];

/* Words the recognizer commonly returns for a correct pronunciation. */
const ALIAS = {
  cathay:["cathy","kathy","cathey","kathay","cathie","cafe"],
  four:["for","4","fore"], to:["two","2","too"], for:["4","four"],
  and:["an","n"], new:["knew"], first:["1st"], its:["it","itss"],
  offers:["offer","offers"], class:["klass"], each:["eat"],
  needs:["need","knees"], of:["off"], is:["his"]
};

const $ = s => document.querySelector(s);
const clean = w => (w || "").toLowerCase().replace(/[^a-z0-9]/g, "");

function lev(a, b){
  const m = a.length, n = b.length;
  if(!m) return n; if(!n) return m;
  let prev = Array.from({length:n+1}, (_,i)=>i);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    prev=cur;
  }
  return prev[n];
}
/* Rough "sounds like" key: keeps the first letter and the consonants, so Cathy/Cathay and offer/offers match. */
function skel(w){
  const s = w.replace(/ph/g,"f").replace(/ck/g,"k").replace(/c(?=[eiy])/g,"s").replace(/c/g,"k")
    .replace(/q/g,"k").replace(/x/g,"ks").replace(/z/g,"s").replace(/(.)\1+/g,"$1");
  return s.charAt(0) + s.slice(1).replace(/[aeiouy]/g,"");
}
let level = "easy";   // easy | normal | strict
try{ const v = localStorage.getItem("csc-level"); if(v === "easy" || v === "normal" || v === "strict") level = v; }catch(_){}
function same(heard, target){
  if(!heard || !target) return false;
  if(heard === target) return true;
  if((ALIAS[target]||[]).includes(heard)) return true;
  if(level === "strict") return false;
  const L = target.length, d = lev(heard, target);
  if(level === "normal"){
    if(L >= 5 && d <= 1) return true;
    if(L >= 9 && d <= 2) return true;
    return L >= 5 && skel(heard) === skel(target);
  }
  // easy
  if(L <= 3) return d <= 1 && heard[0] === target[0];
  if(d <= 1) return true;
  if(L >= 6 && d <= 2) return true;
  if(L >= 9 && d <= 3) return true;
  return skel(heard) === skel(target);
}

/* ---------- sound ---------- */
let soundOn = true, ac = null;
function audio(){
  if(!ac){ const C = window.AudioContext || window.webkitAudioContext; if(C) ac = new C(); }
  if(ac && ac.state === "suspended") ac.resume();
  return ac;
}
function tone(f, t0, dur, type, vol){
  const a = audio(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination);
  o.start(t0); o.stop(t0 + dur + 0.03);
}
function ting(){
  if(!soundOn) return; const a = audio(); if(!a) return; const t = a.currentTime;
  tone(1568, t, 0.55, "sine", 0.28); tone(2349, t, 0.4, "sine", 0.12); tone(3136, t, 0.25, "sine", 0.05);
}
function buzz(){
  if(!soundOn) return; const a = audio(); if(!a) return; const t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain(), f = a.createBiquadFilter();
  o.type = "sawtooth"; o.frequency.setValueAtTime(190, t); o.frequency.exponentialRampToValueAtTime(105, t + 0.32);
  f.type = "lowpass"; f.frequency.value = 1100;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.01);
  g.gain.setValueAtTime(0.3, t + 0.22); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
  o.connect(f).connect(g).connect(a.destination); o.start(t); o.stop(t + 0.37);
}
function fanfare(){
  if(!soundOn) return; const a = audio(); if(!a) return; const t = a.currentTime;
  [1046, 1318, 1568, 2093].forEach((f,i)=>tone(f, t + i*0.11, 0.5, "triangle", 0.22));
}

/* ---------- state ---------- */
let slideIdx = 0, lineIdx = 0;
let words = [], ptr = 0, judged = 0;
let listening = false, wantListening = false, finished = false, rec = null;
const scores = {};   // "s-l" -> {ok,total}
const key = () => slideIdx + "-" + lineIdx;

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

/* ---------- render ---------- */
function renderTabs(){
  const box = $("#tabs"); box.innerHTML = "";
  SLIDES.forEach((s, i) => {
    const b = document.createElement("button");
    b.className = "tab"; b.type = "button"; b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(i === slideIdx));
    b.innerHTML = "<b></b><span></span>";
    b.querySelector("b").textContent = s.title;
    b.querySelector("span").textContent = s.sub;
    b.onclick = () => { stopRec(); slideIdx = i; lineIdx = 0; loadLine(); };
    box.appendChild(b);
  });
}
function renderPills(){
  const box = $("#pills"); box.innerHTML = "";
  SLIDES[slideIdx].lines.forEach((_, i) => {
    const b = document.createElement("button");
    b.className = "pill"; b.type = "button";
    b.textContent = i + 1;
    b.setAttribute("aria-label", "ประโยคที่ " + (i + 1));
    if(i === lineIdx) b.setAttribute("aria-current", "true");
    const sc = scores[slideIdx + "-" + i];
    if(sc) b.dataset.r = sc.ok === sc.total ? "perfect" : "partial";
    b.insertAdjacentHTML("beforeend", "<i></i>");
    b.onclick = () => { stopRec(); lineIdx = i; loadLine(); };
    box.appendChild(b);
  });
  const done = Object.values(scores).length;
  const tot = SLIDES.reduce((n, s) => n + s.lines.length, 0);
  const el = document.createElement("span");
  el.className = "score"; el.textContent = "ทำแล้ว " + done + "/" + tot + " ประโยค";
  box.appendChild(el);
}
function loadLine(){
  const S = SLIDES[slideIdx], L = S.lines[lineIdx];
  const en = L.en.split(/\s+/), th = L.th.replace(/,/g, "").split(/\s+/);
  words = en.map((w, i) => ({ en: w, th: th[i] || "", norm: clean(w), s: "pending", heard: "" }));
  ptr = 0; judged = 0; finished = false;
  $("#slideLabel").textContent = S.title + " · " + S.sub + " · ประโยค " + (lineIdx + 1) + "/" + S.lines.length;
  const box = $("#chips"); box.innerHTML = "";
  words.forEach((w, i) => {
    const c = document.createElement("button");
    c.type = "button"; c.className = "chip"; c.dataset.i = i; c.dataset.s = "pending";
    c.innerHTML = '<span class="en"></span><span class="th"></span><span class="heard"></span>';
    c.querySelector(".en").textContent = w.en;
    c.querySelector(".th").textContent = w.th;
    c.onclick = () => speak(w.en.replace(/[^\w']/g, ""));
    box.appendChild(c);
  });
  markCur();
  $("#result").hidden = true;
  setStatus("พร้อมแล้ว", "กดไมค์ แล้วอ่านประโยคทีละคำ");
  renderTabs(); renderPills();
}
function chipEl(i){ return $("#chips").children[i]; }
function markCur(){
  [...$("#chips").children].forEach(c => c.classList.remove("cur"));
  if(ptr < words.length) chipEl(ptr).classList.add("cur");
}
function paint(i){
  const c = chipEl(i), w = words[i];
  c.dataset.s = w.s;
  c.querySelector(".heard").textContent = w.s === "bad" ? (w.heard ? "ได้ยิน: " + w.heard : "ข้ามคำ") : "";
}
function setStatus(a, b){ $("#stTitle").textContent = a; $("#stSub").textContent = b; }
function setListening(on){
  listening = on;
  const m = $("#mic"); m.classList.toggle("on", on);
  m.setAttribute("aria-label", on ? "หยุดฟัง" : "เริ่มฟัง");
}
function showNotice(msg){ const n = $("#notice"); n.textContent = msg || ""; n.hidden = !msg; }

/* ---------- judging ---------- */
function mark(i, ok, heard){
  words[i].s = ok ? "ok" : "bad";
  words[i].heard = heard || "";
  paint(i);
  ok ? ting() : buzz();
}
/* ranks[k] = the whole transcript as word list for the k-th best guess of the recognizer. */
function cands(ranks, i){
  const out = [];
  ranks.forEach(r => { if(r[i] && !out.includes(r[i])) out.push(r[i]); });
  return out;
}
const hit = (c, t) => c.some(x => same(x, t));
function judge(ranks, lastIsInterim){
  const tokens = ranks[0];
  for(let i = judged; i < tokens.length && ptr < words.length; i++){
    const c = cands(ranks, i);
    const isLast = lastIsInterim && i === tokens.length - 1;
    if(hit(c, words[ptr].norm)){
      mark(ptr, true); ptr++; judged = i + 1;
    } else if(isLast){
      break;  // the newest interim word may still change
    } else if(ptr + 1 < words.length && hit(c, words[ptr + 1].norm)){
      mark(ptr, false, "");            // skipped a word
      ptr++;
      mark(ptr, true); ptr++; judged = i + 1;
    } else {
      mark(ptr, false, tokens[i]); ptr++; judged = i + 1;
    }
  }
  markCur();
  if(ptr >= words.length && !finished) finish();
}
function onResult(e){
  const N = 5, ranks = Array.from({length:N}, () => []);
  let lastInterim = false;
  for(let i = 0; i < e.results.length; i++){
    const r = e.results[i];
    for(let k = 0; k < N; k++){
      const alt = r[k] || r[0];
      alt.transcript.trim().split(/\s+/).map(clean).filter(Boolean).forEach(t => ranks[k].push(t));
    }
    if(i === e.results.length - 1) lastInterim = !r.isFinal;
  }
  judge(ranks, lastInterim);
}
function finish(){
  finished = true; wantListening = false;
  try{ rec && rec.stop(); }catch(_){}
  setListening(false);
  const ok = words.filter(w => w.s === "ok").length, total = words.length;
  scores[key()] = { ok, total };
  const perfect = ok === total;
  $("#resBig").textContent = perfect ? "ถูกครบ " + total + " คำ" : "ถูก " + ok + " จาก " + total + " คำ";
  $("#resSub").textContent = perfect
    ? "อ่านได้ชัดทุกคำ ไปประโยคถัดไปได้เลย"
    : "แตะคำสีแดงเพื่อฟังเสียงที่ถูกต้อง แล้วลองอีกครั้ง";
  $("#result").hidden = false;
  setStatus(perfect ? "เยี่ยมมาก" : "จบประโยคแล้ว", "ดูผลด้านล่าง");
  if(perfect) setTimeout(fanfare, 250);
  renderPills();
}

/* ---------- recognition ---------- */
function startRec(){
  showNotice("");
  if(!SR){
    showNotice("เบราว์เซอร์นี้ยังไม่รองรับการฟังเสียง กรุณาเปิดไฟล์นี้ด้วย Google Chrome หรือ Microsoft Edge");
    return;
  }
  audio();
  if(finished) loadLine();
  rec = new SR();
  rec.lang = "en-US"; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 1;
  rec.onresult = onResult;
  rec.onerror = ev => {
    if(ev.error === "no-speech" || ev.error === "aborted") return;
    wantListening = false; setListening(false);
    const msg = {
      "not-allowed": "ไม่ได้รับอนุญาตให้ใช้ไมโครโฟน กดไอคอนแม่กุญแจข้างช่องที่อยู่เว็บ แล้วเลือกอนุญาตไมโครโฟน",
      "service-not-allowed": "ไม่ได้รับอนุญาตให้ใช้ไมโครโฟน",
      "audio-capture": "ไม่พบไมโครโฟน ตรวจสอบว่าเสียบไมค์หรือเปิดไมค์ในเครื่องแล้ว",
      "network": "การรู้จำเสียงต้องใช้อินเทอร์เน็ต ตรวจสอบการเชื่อมต่อแล้วลองใหม่"
    }[ev.error] || ("เกิดข้อผิดพลาดกับการฟังเสียง (" + ev.error + ")");
    showNotice(msg);
    setStatus("หยุดฟังแล้ว", "กดไมค์เพื่อลองใหม่");
  };
  rec.onend = () => {
    if(wantListening && !finished){
      judged = 0;                       // a new session starts its own transcript
      try{ rec.start(); }catch(_){}
    } else setListening(false);
  };
  judged = 0; wantListening = true;
  try{ rec.start(); }catch(_){}
  setListening(true);
  setStatus("กำลังฟัง", "อ่านทีละคำได้เลย");
}
function stopRec(){
  wantListening = false;
  try{ rec && rec.stop(); }catch(_){}
  if(listening){ setListening(false); if(!finished) setStatus("หยุดฟังแล้ว", "กดไมค์เพื่ออ่านต่อ"); }
}

/* ---------- speech synthesis (reference pronunciation) ---------- */
function speak(text, rate){
  if(!("speechSynthesis" in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = rate || 0.8;
  speechSynthesis.speak(u);
}

/* ---------- events ---------- */
$("#mic").onclick = () => { listening ? stopRec() : startRec(); };
$("#soundBtn").onclick = e => {
  soundOn = !soundOn; e.currentTarget.setAttribute("aria-pressed", String(soundOn));
  if(soundOn) ting();
};
$("#hearLine").onclick = () => speak(SLIDES[slideIdx].lines[lineIdx].en, 0.85);
$("#resetBtn").onclick = () => { stopRec(); loadLine(); };
$("#retryBtn").onclick = () => { stopRec(); loadLine(); startRec(); };
$("#nextBtn").onclick = () => {
  stopRec();
  const S = SLIDES[slideIdx];
  if(lineIdx + 1 < S.lines.length) lineIdx++;
  else if(slideIdx + 1 < SLIDES.length){ slideIdx++; lineIdx = 0; }
  else { lineIdx = 0; slideIdx = 0; }
  loadLine();
};

loadLine();
if(!SR) showNotice("เบราว์เซอร์นี้ยังไม่รองรับการฟังเสียง กรุณาเปิดไฟล์นี้ด้วย Google Chrome หรือ Microsoft Edge");
</script>
